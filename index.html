function bake(g,material=VCOL){
  g.updateMatrixWorld(true);
  const pos=[],nor=[],col=[],v=new T.Vector3(),nm=new T.Matrix3(),m4=new T.Matrix4(),inv=new T.Matrix4().copy(g.matrixWorld).invert();

    const geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry, p=geo.attributes.position, n=geo.attributes.normal, c=o.material.color;

    for(let i=0;i<p.count;i++){
      v.fromBufferAttribute(p,i).applyMatrix4(m4); pos.push(v.x,v.y,v.z);
      v.fromBufferAttribute(n,i).applyMatrix3(nm).normalize(); nor.push(v.x,v.y,v.z); col.push(c.r,c.g,c.b);

  });

  bg.setAttribute('position',new T.Float32BufferAttribute(pos,3)); bg.setAttribute('normal',new T.Float32BufferAttribute(nor,3));
  bg.setAttribute('color',new T.Float32BufferAttribute(col,3));
  return new T.Mesh(bg,material);
}

const EDGES=(BE+'n0-n1,n1-n2,n2-n3,N1-n1,N5-n2,S2-p1,h0-p1,p1-c1,c1-c2,c2-c3,S6-e1,e1-c2,S7-e2,e2-c3,e0-e1,e1-e2,e2-e3,S4-pa,pa-ps,ps-pe,pe-e0,N3-g1,c1-be,be-bw,be-bx').split(',').map(s=>{

const ADJ={}; for(const e of EDGES){ (ADJ[e.a]=ADJ[e.a]||[]).push([e.b,e.len]); (ADJ[e.b]=ADJ[e.b]||[]).push([e.a,e.len]); }
function nearestEdge(x,z){
  let best=null;
  for(const e of EDGES){
    const dx=e.bx-e.ax, dz=e.bz-e.az, t=clamp(((x-e.ax)*dx+(z-e.az)*dz)/(e.len*e.len),0,1), px=e.ax+dx*t, pz=e.az+dz*t, d=Math.hypot(x-px,z-pz);
    if(!best||d<best.d) best={e,t,x:px,z:pz,d};

function findRoute(sx,sz,tx,tz){
  const A=nearestEdge(sx,sz), B=nearestEdge(tx,tz);
  if(A.e===B.e||Math.hypot(tx-sx,tz-sz)<A.d+B.d) return [[sx,sz],[A.x,A.z],[B.x,B.z],[tx,tz]];
  const dist={}, prev={}, done={};
  dist[A.e.a]=A.t*A.e.len; dist[A.e.b]=(1-A.t)*A.e.len;
  for(;;){
    let u=null; for(const k in dist) if(!done[k]&&(u===null||dist[k]<dist[u])) u=k;
    if(u===null) break; done[u]=1;
    for(const [w,l] of ADJ[u]) if(dist[w]===undefined||dist[u]+l<dist[w]){ dist[w]=dist[u]+l; prev[w]=u; }
  }
  let end=dist[B.e.a]+B.t*B.e.len<dist[B.e.b]+(1-B.t)*B.e.len?B.e.a:B.e.b;
  const mid=[]; for(let k=end;k;k=prev[k]) mid.unshift(NODES[k]);
  return [[sx,sz],[A.x,A.z],...mid,[B.x,B.z],[tx,tz]];
}

function makePerson(shirt,pants,skin,hat,plate){
  const g=new T.Group(), u={legL:new T.Group(),legR:new T.Group(),armL:new T.Group(),armR:new T.Group()};
  u.legL.position.set(.11,.85,0); u.legR.position.set(-.11,.85,0); u.armL.position.set(.3,1.44,0); u.armR.position.set(-.3,1.44,0);

  for(const a of [u.armL,u.armR]) mk(G.box,skin,0,-.28,0,.12,.6,.13,a);
  u.shirt=mk(G.box,shirt,0,1.16,0,.46,.64,.26,g); mk(G.head,skin,0,1.66,0,1,1,1,g);

function honk(){   // traffic ahead of you hurries up
  if(!started||paused) return; sfx.horn();
  const sh=Math.sin(P.h), ch=Math.cos(P.h);
  for(const v of traffic){ const rx=v.x-P.x, rz=v.z-P.z, f=rx*sh+rz*ch; if(f>0&&f<30&&Math.abs(rx*ch-rz*sh)<4.5) v.honk=3; }
}

function collide(o,r){
  let hit=false;
  for(const c of colliders){
    const cx=clamp(o.x,c[0],c[1]), cz=clamp(o.z,c[2],c[3]), dx=o.x-cx, dz=o.z-cz, d2=dx*dx+dz*dz;
    if(d2>=r*r) continue; hit=true;
    if(d2>1e-6){ const d=Math.sqrt(d2); o.x=cx+dx/d*r; o.z=cz+dz/d*r; }
    else { const l=o.x-c[0], rt=c[1]-o.x, t=o.z-c[2], b=c[3]-o.z, m=Math.min(l,rt,t,b);
      if(m===l)o.x=c[0]-r; else if(m===rt)o.x=c[1]+r; else if(m===t)o.z=c[2]-r; else o.z=c[3]+r; }
  }
  return hit;
}
const surface=(x,z)=>z>198?'sand':earthRects.some(r=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3])&&!(z<-116)?'earth':'road';
function updatePlayer(dt){
  const ix=clamp((K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+joy.x,-1,1);
  const iy=clamp((K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+joy.y,-1,1);
  const shift=K.ShiftLeft||K.ShiftRight||btnB;
  bumpCd-=dt; thr=0; braking=false;
  if(P.mode==='walk'){
    const len=Math.min(1,Math.hypot(ix,iy)); walkFwd=iy;
    if(len>.12){
      const a=camYaw+Math.atan2(-ix,iy), sp=(shift?7:3.3)*len;
      P.h+=angDiff(P.h,a)*Math.min(1,dt*11); P.x+=Math.sin(a)*sp*dt; P.z+=Math.cos(a)*sp*dt; P.walkT+=sp*dt*2.3; P.speed=sp;
      pose(driver,'walk',P.walkT);
    } else { P.speed=0; pose(driver,'stand'); }
    collide(P,.45);
  } else {
    surf=surface(P.x,P.z);
    const pw=S.own.sport?2:S.own.engine?1:0, car=veh.kind==='car';
    const top=car?60:veh.own?[72,78,86][pw]:72, acc=car?14:veh.own?[28,31,35][pw]:28;      // m/s: about 260 / 280 / 310 km/h for a moto, 215 for a car
    const vmax=surf==='sand'?12:surf==='earth'?top*.55:top, steer=-ix;
    if(iy>0){ thr=iy; P.speed+=iy*acc*(1-clamp(P.speed/vmax,0,1))*dt; }
    else if(iy<0){ if(P.speed>.5){ P.speed+=iy*24*dt; braking=true; } else P.speed=Math.max(P.speed+iy*6*dt,-5); }
    else P.speed-=Math.sign(P.speed)*Math.min(Math.abs(P.speed),1.5*dt);
    if(shift||K.Space){ P.speed-=Math.sign(P.speed)*Math.min(Math.abs(P.speed),32*dt); braking=true; }
    P.speed-=P.speed*(surf==='sand'?1.1:surf==='earth'?.22:iy>0?0:.1)*dt; if(P.speed>vmax) P.speed=lerp(P.speed,vmax,Math.min(1,dt*3));
    const sp=Math.abs(P.speed);
    P.h+=steer*(car?1.7:2.4)*clamp(sp/5,0,1)/(1+sp/20)*(P.speed<0?-1:1)*dt;
    P.lean=car?0:lerp(P.lean,-steer*clamp(sp/12,0,1)*.5,1-Math.exp(-dt*7));
    const n=Math.max(1,Math.ceil(sp*dt/.6)); let hit=false;                               // small steps so nothing is skipped at speed
    for(let i=0;i<n;i++){ P.x+=Math.sin(P.h)*P.speed*dt/n; P.z+=Math.cos(P.h)*P.speed*dt/n; if(collide(P,car?1.5:.8)) hit=true; }
    if(hit){ if(sp>18&&bumpCd<=0){ bumpCd=1; P.speed*=.35; sfx.bump(); } else P.speed*=Math.pow(.03,dt); }
    if(veh.u.wheels) for(const w of veh.u.wheels) w.rotation.x+=P.speed*dt/.32;
  }
  { const cx=clamp(P.x,-319.5,259.5), cz=clamp(P.z,-299,232); if(cx!==P.x||cz!==P.z){ P.x=cx; P.z=cz; if(P.mode==='ride') P.speed*=Math.pow(.0005,dt); } }   // the edge of the map stops you
  if(P.mode==='walk'){ driver.position.set(P.x,EY,P.z); driver.rotation.y=P.h; }
  else { veh.x=P.x; veh.z=P.z; veh.h=P.h; if(veh.u.tilt) veh.u.tilt.rotation.z=P.lean; }
  for(const v of [own,stolen]) if(v){ v.obj.position.set(v.x,EY,v.z); v.obj.rotation.y=v.h; }
  if(veh.u.tail) veh.u.tail.material.color.setHex(braking?0xff2a2a:0x7a1414);
  pShadow.visible=P.mode==='walk'; pShadow.position.set(P.x,EY+.08,P.z);
  // dust on earth and sand
  if(P.mode==='ride'&&surf!=='road'&&Math.abs(P.speed)>4){ dustT-=dt; if(dustT<=0){ dustT=.05; const d=dust[dustI++%16]; d.l=.7; d.m.visible=true;
    DUST.color.setHex(surf==='sand'?0xe8d7a8:0xc98f5e); d.m.position.set(P.x-Math.sin(P.h)*.9+(Math.random()-.5)*.5,EY+.2,P.z-Math.cos(P.h)*.9+(Math.random()-.5)*.5); } }
  for(const d of dust) if(d.l>0){ d.l-=dt; d.m.position.y+=dt*1.1; d.m.scale.setScalar(.25+(1-d.l/.7)*.9); if(d.l<=0) d.m.visible=false; }
}

const skyDay=new T.Color(0x86caee), skySet=new T.Color(0xf3a56b), sunDay=new T.Color(0xfff2d6), sunSet=new T.Color(0xff9148);

function camClip(tx,tz,cx,cz){   // fraction of the way to the camera before a building gets in between
  const dx=cx-tx, dz=cz-tz; let tmin=1;
  for(const c of walls){
    let t0=0, t1=1;
    if(Math.abs(dx)<1e-6){ if(tx<c[0]||tx>c[1]) continue; } else { let a=(c[0]-tx)/dx, b=(c[1]-tx)/dx; if(a>b){const s=a;a=b;b=s;} t0=Math.max(t0,a); t1=Math.min(t1,b); }
    if(Math.abs(dz)<1e-6){ if(tz<c[2]||tz>c[3]) continue; } else { let a=(c[2]-tz)/dz, b=(c[3]-tz)/dz; if(a>b){const s=a;a=b;b=s;} t0=Math.max(t0,a); t1=Math.min(t1,b); }
    if(t0<=t1&&t0<tmin) tmin=t0;
  }
  return tmin;
}
function updateCamera(dt,t){
  if(!started){ camera.position.set(Math.sin(t*.12+PI)*120,26,Math.cos(t*.12+PI)*120); camera.lookAt(0,17,0); return; }
  const riding=P.mode==='ride', sp=Math.abs(P.speed);
  if(!look&&t-lastDrag>1.2){
    const rate=riding?(sp>1?3:0):1.6*Math.max(0,walkFwd)*(sp>0?1:0);
    camYaw+=angDiff(camYaw,P.h)*Math.min(1,rate*dt);
    if(rate>0) camPitch=lerp(camPitch,riding?.27:.33,Math.min(1,dt*.8));
  }
  let d=riding?(veh.kind==='car'?10.5:8)+Math.min(sp,45)*.13:6.5; const cp=Math.cos(camPitch), sx=-Math.sin(camYaw)*cp, sz=-Math.cos(camYaw)*cp;
  const k=camClip(P.x,P.z,P.x+sx*d,P.z+sz*d); if(k<1) d=Math.max(1.6,d*k-.3); camD=d;
  tmp.set(P.x+sx*d,1.7+Math.sin(camPitch)*d+(k<1?(1-k)*5:0),P.z+sz*d);   // squeezed against a wall: rise and look down
  camera.position.lerp(tmp,1-Math.exp(-dt*10)); camera.lookAt(P.x,1.9,P.z);
  const fov=62+(riding?Math.min(sp,50)*.42:0); if(Math.abs(camera.fov-fov)>.05){ camera.fov=lerp(camera.fov,fov,Math.min(1,dt*4)); camera.updateProjectionMatrix(); }
}
const skyNight=new T.Color(0x0c1a33), moonCol=new T.Color(0x8fa6e8); let camD=8, skyF=0;
function updateSky(t){   // day -> sunset -> night -> sunrise, about seven minutes a cycle
  const p=((t+30)/420)%1; let k=0, n=0;
  if(p<.34){} else if(p<.5) k=(p-.34)/.16; else if(p<.6){ k=1; n=(p-.5)/.1; } else if(p<.84){ k=1; n=1; } else if(p<.92){ k=1; n=1-(p-.84)/.08; } else k=1-(p-.92)/.08;
  const el=lerp(1.05,.1,k)-n*.6;
  sky.copy(skyDay).lerp(skySet,k).lerp(skyNight,n); scene.fog.color.copy(sky);
  sunDir.set(-Math.cos(el)*.8,Math.sin(el),Math.cos(el)*.6).normalize();
  sun.position.set(sunDir.x,Math.max(.3,sunDir.y),sunDir.z).multiplyScalar(300); sun.color.copy(sunDay).lerp(sunSet,k).lerp(moonCol,n); sun.intensity=lerp(lerp(.62,.75,k),.42,n);
  hemi.intensity=lerp(lerp(.55,.47,k),.52,n); hemi.color.copy(sky).lerp(sunDay,.6*(1-n*.6));
  sunBall.visible=n<.6; sunBall.position.copy(camera.position).addScaledVector(sunDir,camera.far*.76); sunBall.material.color.copy(ballDay).lerp(ballSet,k);
  LAMP.color.copy(lampDay).lerp(lampNight,Math.max(k*k,n)); GLOWD.opacity=n*.2;                       // streetlights and their pools of light
  headGlow.visible=n>.02; headGlow.material.opacity=n*.38; foam.material.opacity=.6-n*.4;
  if(S.gfx!=='low'||++skyF%2===0){
    const wp=water.geometry.attributes.position;
    for(let i=0;i<wp.count;i++){ const x=wp.getX(i), z=wp.getZ(i), a=Math.min(1,(z+280)/60);
      wp.setY(i,(Math.sin(x*.045+t*1.1)+Math.cos(z*.07+t*1.5))*.22*a+.3*a); }
    wp.needsUpdate=true;
  }
  foam.position.z=234.5+Math.sin(t*.9)*1.6;
}

      h+='<div class="row"><div>'+(set[o]!=null?'<span class="sw" style="background:'+css(set[o])+'"></span>':'')+'<b>'+tr(g,tr(o))+'</b></div>'+
        (S[g]===o?'<button class="btn" disabled>'+tr('inUse')+'</button>':has?'<button class="btn" data-opt="'+g+':'+o+'">'+tr('use')+'</button>'
          :'<button class="btn" data-opt="'+g+':'+o+'"'+(S.money<cost?' disabled':'')+'>'+tr('buy',cost)+'</button>')+'</div>'; } }
  const fc=FLEET[S.fleet];
  h+='<div class="row"><div><b>'+tr('fleet',S.fleet)+'</b><small>'+tr('fleetD')+'</small></div>'+(fc?'<button class="btn" data-fleet="1"'+(S.money<fc?' disabled':'')+'>'+tr('buy',fmt(fc))+'</button>':'<button class="btn" disabled>'+tr('owned')+'</button>')+'</div>';
  for(const [id,cost] of PROJ) h+='<div class="row"><div><b>'+tr('p_'+id)+'</b><small>'+tr('p_'+id+'D')+'</small></div>'+
    (S.proj[id]?'<button class="btn" disabled>'+tr('done')+'</button>':'<button class="btn" data-proj="'+id+'"'+(S.money<cost?' disabled':'')+'>'+tr('buy',fmt(cost))+'</button>')+'</div>';
  $('shopList').innerHTML=h;
}
$('shopList').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.buy){ const it=ITEMS.find(i=>i[0]===b.dataset.buy); if(S.money<it[1]) return sfx.deny(); S.money-=it[1]; S.own[it[0]]=true; sfx.buy(); }
  else if(b.dataset.fleet){ const c=FLEET[S.fleet]; if(!c||S.money<c) return sfx.deny(); S.money-=c; S.fleet++; sfx.buy(); }
  else if(b.dataset.proj){ const pr=PROJ.find(q=>q[0]===b.dataset.proj); if(S.money<pr[1]) return sfx.deny(); S.money-=pr[1]; S.proj[pr[0]]=true; applyProjects(); sfx.buy(); }
  else if(b.dataset.opt){ const [g,o]=b.dataset.opt.split(':'), [,cost,list]=OPTS[g];
    if(!S[list].includes(o)){ if(S.money<cost) return sfx.deny(); S.money-=cost; S[list].push(o); sfx.buy(); } S[g]=o; if(g==='horn') sfx.horn(); }
  applyGear(); updateMoney(); save(); renderShop();
});

// minimap: a 600 m window that follows you over a pre-drawn map of the whole city
const mini=$('mini'), mctx=mini.getContext('2d'), MS=300, SC=.5, MX0=-330, MZ0=-320, MX=x=>(x-MX0)*SC, MZ=z=>(z-MZ0)*SC, miniBg=document.createElement('canvas');
(()=>{
  const W=miniBg.width=(280-MX0)*SC, H=miniBg.height=(290-MZ0)*SC, c=miniBg.getContext('2d'), R=(x0,x1,z0,z1)=>c.fillRect(MX(x0),MZ(z0),(x1-x0)*SC,(z1-z0)*SC);
  c.fillStyle='#cdb083'; c.fillRect(0,0,W,H); c.fillStyle='#f1dfa8'; R(MX0,280,198,236); c.fillStyle='#3b8fb0'; R(MX0,280,236,290);
  for(const r of mapRects){ c.fillStyle=css(r[4]); R(r[0],r[1],r[2],r[3]); }
  c.fillStyle='#4f9a35'; R(-330,270,-136.5,-133.5); c.fillStyle='#8f8f8b'; R(237,270,-116,198); c.fillStyle='#8b7762';
  for(const b of mapB) c.fillRect(MX(b[0]),MZ(b[1]),b[2]*SC,b[3]*SC);
  c.strokeStyle='#fff'; c.lineWidth=1.5; c.fillStyle='#8e44ad'; c.fillRect(MX(GAR.x)-5,MZ(GAR.z)-5,10,10); c.strokeRect(MX(GAR.x)-5,MZ(GAR.z)-5,10,10);
})();
let navPath=null, navT=0, navTarget=null, navLen=0;
function drawMini(){
  const c=mctx, ox=clamp(MX(P.x)-MS/2,0,miniBg.width-MS), oz=clamp(MZ(P.z)-MS/2,0,miniBg.height-MS);
  c.drawImage(miniBg,ox,oz,MS,MS,0,0,MS,MS);
  const X=x=>MX(x)-ox, Z=z=>MZ(z)-oz, ex=x=>clamp(X(x),7,MS-7), ez=z=>clamp(Z(z),7,MS-7);   // far-away targets stick to the edge
  if(navPath){ c.strokeStyle=job||mission?'#19e36e':'#ffd400'; c.lineWidth=4; c.lineJoin='round'; c.beginPath();
    navPath.forEach((p,i)=>i?c.lineTo(X(p[0]),Z(p[1])):c.moveTo(X(p[0]),Z(p[1]))); c.stroke(); }
  c.fillStyle='#b5651d'; c.strokeStyle='#fff'; c.lineWidth=2.5; c.beginPath();            // statue: bronze diamond
  c.moveTo(X(0),Z(0)-11); c.lineTo(X(0)+9,Z(0)); c.lineTo(X(0),Z(0)+11); c.lineTo(X(0)-9,Z(0)); c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#ececec'; for(const v of traffic) if(!(v.out>0)) c.fillRect(X(v.x)-2.5,Z(v.z)-2.5,5,5);
  c.strokeStyle='#222'; c.lineWidth=1.5;
  for(const p of pax) if(p.state==='wait'){ c.fillStyle=css(TYPES[p.type][1]); c.beginPath(); c.arc(ex(p.spot.x),ez(p.spot.z),5.5,0,7); c.fill(); c.stroke(); }
  c.strokeStyle='#fff'; c.lineWidth=3;
  if(mission) for(const s of mStops()){ c.fillStyle='#35c8ff'; c.beginPath(); c.arc(ex(s.s.x),ez(s.s.z),8,0,7); c.fill(); c.stroke(); }
  if(job){ c.fillStyle='#2ecc71'; c.beginPath(); c.arc(ex(job.dest.x),ez(job.dest.z),9,0,7); c.fill(); c.stroke(); }
  for(const v of [own,stolen]) if(v&&(P.mode==='walk'||v!==veh)){ c.fillStyle=v.own?'#d62828':'#ff8c1a'; c.fillRect(ex(v.x)-4,ez(v.z)-4,8,8); }
  c.save(); c.translate(X(P.x),Z(P.z)); c.rotate(PI-P.h);
  c.fillStyle='#fff'; c.strokeStyle='#111'; c.lineWidth=2; c.beginPath(); c.moveTo(0,-11); c.lineTo(8,9); c.lineTo(0,4); c.lineTo(-8,9); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
const STATUE={x:0,z:-16,n:''};
function updateHud(t,dt){
  const riding=P.mode==='ride', sp=Math.abs(P.speed); let tx=null, hint='', col=0xffd400, nearPax=null, mStop=null;
  if(mission){ let bd=1e9; for(const s of mStops()){ const d=Math.hypot(P.x-s.s.x,P.z-s.s.z); if(d<bd){bd=d;mStop=s;} } tx=mStop.s; col=0x35c8ff; beacon.visible=true; beacon.position.set(tx.x,0,tx.z); }
  else if(job){ tx=job.via&&!job.viaDone?STATUE:job.dest; col=0x2ecc71; }
  else { let bd=1e9; for(const p of pax) if(p.state==='wait'){ const d=Math.hypot(P.x-p.spot.x,P.z-p.spot.z); if(d<bd){bd=d;tx=p.spot;nearPax=p;} } }
  if(!riding){ tx=veh; col=0xff5a3c; nearPax=null; }
  // road route to the target, refreshed a few times a second
  navT-=dt;
  if(tx&&(navT<=0||tx!==navTarget)){ navT=.4; navTarget=tx; navPath=riding?findRoute(P.x,P.z,tx.x,tx.z):[[P.x,P.z],[tx.x,tx.z]];
    navLen=0; for(let i=1;i<navPath.length;i++) navLen+=Math.hypot(navPath[i][0]-navPath[i-1][0],navPath[i][1]-navPath[i-1][1]); }
  if(!tx) navPath=null;
  const dist=Math.round(navLen);
  if(mission){
    const s=Math.max(0,Math.ceil(mission.t));
    setText('job','🎯 '+tr('m_'+mission.def.id)+' · '+tr('k_'+mStop.kind)+' '+mStop.s.n+' · '+dist+' m · ⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));
    if(riding&&Math.hypot(P.x-tx.x,P.z-tx.z)<16&&sp>=1.5) hint=tr('stopBeam');
  } else if(job){
    const s=Math.floor(job.type==='hurry'?Math.max(0,job.par*1.35-job.t):job.t), tm=(job.type==='hurry'?'⏱ ':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    setText('job',job.via&&!job.viaDone?tr('jobVia',job.dest.n,dist):tr('jobTo',job.dest.n,dist,tm,fmt(job.base-Math.min(round25(job.bumps*bumpCost(job)),round25(job.base/2)))));
    if(riding&&Math.hypot(P.x-job.dest.x,P.z-job.dest.z)<16&&sp>=1.5&&(!job.via||job.viaDone)) hint=tr('stopBeam');
  } else if(nearPax){
    setText('job',tr('waving',tr('t'+nearPax.type),tx.n,dist));
    if(riding&&Math.hypot(P.x-tx.x,P.z-tx.z)<14&&sp>=1.5) hint=tr('stopPax');
  } else setText('job',tr('looking'));
  if(!riding&&!job&&!mission) setText('job',tr('looking'));
  if(!riding){ const d=Math.hypot(P.x-veh.x,P.z-veh.z), d2=Math.min(Math.hypot(P.x-own.x,P.z-own.z),stolen?Math.hypot(P.x-stolen.x,P.z-stolen.z):1e9), nv=d2>3.2&&nearVeh();
    hint=d2<=3.2?tr(touch?'rideTap':'rideE'):nv?tr(nv.kind==='car'?'takeCar':'takeMoto'):tr('motoAway',Math.round(d)); if(job) hint+=tr('paxWaits'); }
  else if(Math.hypot(P.x-GAR.x,P.z-GAR.z)<18&&!shopNear) hint=tr('shopHint');
  setText('hint',hint);
  el.speed.style.visibility=riding?'visible':'hidden';
  if(riding){ const s=Math.round(sp*3.6)+''; if(cache.sp!==s){ cache.sp=s; el.speed.innerHTML=s+'<small>'+tr('kmh')+'</small>'; } }
  // arrow over the player points along the route, not through buildings
  arrow.visible=!!tx&&Math.hypot(tx.x-P.x,tx.z-P.z)>4&&camD>3.2;
  if(arrow.visible){
    let ax=tx.x, az=tx.z, acc=0;
    for(let i=1;i<navPath.length;i++){ const a=navPath[i-1], b=navPath[i], l=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(acc+l>=20){ const k=(20-acc)/l; ax=a[0]+(b[0]-a[0])*k; az=a[1]+(b[1]-a[1])*k; break; } acc+=l; }
    arrow.material.color.setHex(col); arrow.position.set(P.x,3.3+Math.sin(t*4)*.12,P.z); arrow.rotation.y=Math.atan2(ax-P.x,az-P.z);
  }
  garageMark.rotation.y=t;
  // first-trip guidance: one step at a time
  let tu='';
  if(S.tut<5){
    if(S.trips>0||mission) S.tut=5;
    else { S.tut=job?4:riding?(nearPax&&Math.hypot(P.x-nearPax.spot.x,P.z-nearPax.spot.z)<16?3:2):Math.hypot(P.x-bike.x,P.z-bike.z)<3.2?1:0;
      tu=(S.tut+1)+'/5 · '+tr(S.tut===1&&touch?'t1t':'t'+S.tut); if(S.tut<2) hint=''; }
  }
  setText('tut',tu); if(tu) setText('hint',hint&&S.tut>=2?hint:'');
}

// ---------- main loop ----------
let frame=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime, run=started&&!paused;
  if(run) updatePlayer(dt);
  if(!paused){ updateTraffic(dt); updatePeds(dt); }
  if(run){ updateJobs(dt); updateMission(dt); updateServices(dt); }
  updateCamera(dt,t); updateSky(t); audioUpdate(dt);
  if(run){ updateHud(t,dt); if(++frame%2===0) drawMini(); }
  renderer.render(scene,camera);
}
$('play').addEventListener('click',()=>{
  started=true; $('start').classList.remove('show'); document.body.classList.add('on');
  audioInit(); updateMoney(); toast(tr('hello'));
});
addEventListener('visibilitychange',()=>{ if(!document.hidden) audioUnlock(); if(document.hidden){ save(); if(started&&!$('shop').classList.contains('show')&&!$('board').classList.contains('show')) setPause(true); } });
applyLang(); updatePlayer(0); tick();
})();
